<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUB Fit - Admin Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js">
    </script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>
    <script
      src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const BASE_URL = '/api/admin/orders';

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [orders, setOrders] = useState([]);
            const [totalSales, setTotalSales] = useState(0);
            const [filterDate, setFilterDate] = useState('Today');
            const [dateOptions, setDateOptions] = useState([]);
            const [error, setError] = useState(null);
            
            // Manual Order State
            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [manualOrder, setManualOrder] = useState({
                name: '',
                phone: '',
                items: '',
                totalPrice: '',
                deliveryType: 'home',
                address: '',
                deliveryDate: 'Today',
                timeSlot: 'ASAP'
            });

            // Simple client-side protection
            const handleLogin = (e) => {
                e.preventDefault();
                // You can change this password to anything you like
                if (password === 'tubadmin123') { 
                    setIsAuthenticated(true);
                } else {
                    alert('Incorrect Password');
                }
            };

            const fetchOrders = async () => {
                setLoading(true);
                setError(null);
                try {
                    let url = BASE_URL;
                    if (filterDate && filterDate !== 'All') {
                        url += `?date=${encodeURIComponent(filterDate)}`;
                    }
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const text = await response.text();
                    try {
                        const result = JSON.parse(text);
                        if (result.success) {
                            setOrders(result.data.reverse()); // Newest first
                            setTotalSales(result.totalSales);
                        } else {
                            setError('Failed to fetch data. ' + (result.message || ''));
                        }
                    } catch (parseError) {
                        console.error('Invalid JSON response:', text);
                        setError('Received invalid data from the server. Ensure the backend returns valid JSON.');
                    }
                } catch (err) {
                    console.error(err);
                    setError('Error connecting to the server. Check browser console for details.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (isAuthenticated) {
                    fetchOrders();
                }
            }, [isAuthenticated, filterDate]);

            // Generate Dynamic Date Filters
            useEffect(() => {
                const dates = [];
                const now = new Date();
                
                dates.push({ label: 'Today', value: 'Today' });
                dates.push({ label: 'Tomorrow', value: 'Tomorrow' });
                
                // Add the specific next 5 days
                for (let i = 2; i < 7; i++) {
                    let d = new Date(now);
                    d.setDate(d.getDate() + i);
                    let label = d.toLocaleDateString('en-IN', { weekday: 'short', month: 'short', day: 'numeric' });
                    dates.push({ label: label, value: label });
                }
                
                dates.push({ label: 'Upcoming (All Future)', value: 'Upcoming' });
                dates.push({ label: 'All Time', value: 'All' });
                
                setDateOptions(dates);
            }, []);

            const handleManualSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                const generateOrderId = () => {
                    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                    let id = 'TUB-';
                    for (let i = 0; i < 5; i++) id += chars.charAt(Math.floor(Math.random() * chars.length));
                    return id;
                };
                const orderId = generateOrderId();

                const payload = {
                    orderId: orderId,
                    name: manualOrder.name,
                    phone: manualOrder.phone,
                    deliveryType: manualOrder.deliveryType,
                    address: manualOrder.address || 'Ordered via WhatsApp',
                    items: manualOrder.items,
                    totalPrice: parseFloat(manualOrder.totalPrice) || 0,
                    deliveryDate: manualOrder.deliveryDate,
                    timeSlot: manualOrder.timeSlot,
                    gymPromoCode: 'WHATSAPP',
                    calories: 0, protein: 0, carbs: 0, fats: 0 // Default macros to 0 for manual entries
                };

                try {
                    await fetch('/api/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setIsManualModalOpen(false);
                    setManualOrder({ name: '', phone: '', items: '', totalPrice: '', deliveryType: 'home', address: '', deliveryDate: new Date().toLocaleDateString('en-IN', { weekday: 'short', month: 'short', day: 'numeric' }), timeSlot: 'ASAP' });
                    await fetchOrders();
                } catch (err) {
                    alert("Error saving manual order. Check console.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 px-4">
                        <div className="max-w-md w-full space-y-8 bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
                            <div className="text-center">
                                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-sm border border-green-200">
                                    <i className="fas fa-lock"></i>
                                </div>
                                <h2 className="text-3xl font-bold text-gray-900">Admin Login</h2>
                                <p className="mt-2 text-sm text-gray-500">TUB Fit Secure Dashboard</p>
                            </div>
                            <form className="mt-8 space-y-6" onSubmit={handleLogin}>
                                <div>
                                    <input type="password" required className="appearance-none rounded-xl block w-full px-4 py-4 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm transition-all" placeholder="Enter Password" value={password} onChange={(e) => setPassword(e.target.value)} />
                                </div>
                                <div>
                                    <button type="submit" className="w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-gray-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 shadow-xl transition-all">
                                        Sign in
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    {/* Manual Order Modal */}
                    {isManualModalOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-6 border-b flex justify-between items-center bg-gray-50">
                                    <h3 className="font-bold text-xl text-gray-900"><i className="fab fa-whatsapp text-green-500 mr-2"></i> Add WhatsApp Order</h3>
                                    <button onClick={() => setIsManualModalOpen(false)} className="text-gray-400 hover:text-gray-900 text-2xl">&times;</button>
                                </div>
                                <form onSubmit={handleManualSubmit} className="p-6 overflow-y-auto space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Customer Name</label>
                                            <input required type="text" className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.name} onChange={e => setManualOrder({...manualOrder, name: e.target.value})} placeholder="e.g. Aman" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Phone Number</label>
                                            <input required type="tel" className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.phone} onChange={e => setManualOrder({...manualOrder, phone: e.target.value})} placeholder="9876543210" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Order Items (What did they order?)</label>
                                        <textarea required className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500 h-20" value={manualOrder.items} onChange={e => setManualOrder({...manualOrder, items: e.target.value})} placeholder="1x Grilled Chicken Bowl&#10;1x Extra Egg"></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Total Price (₹)</label>
                                            <input required type="number" className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.totalPrice} onChange={e => setManualOrder({...manualOrder, totalPrice: e.target.value})} placeholder="199" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Delivery Type</label>
                                            <select className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.deliveryType} onChange={e => setManualOrder({...manualOrder, deliveryType: e.target.value})}>
                                                <option value="home">Home</option>
                                                <option value="gym">Gym</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Delivery Date</label>
                                            <input required type="text" className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.deliveryDate} onChange={e => setManualOrder({...manualOrder, deliveryDate: e.target.value})} placeholder="Today" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Time Slot</label>
                                            <input required type="text" className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.timeSlot} onChange={e => setManualOrder({...manualOrder, timeSlot: e.target.value})} placeholder="ASAP" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Address / Notes</label>
                                        <input type="text" className="w-full p-3 bg-gray-50 border rounded-xl focus:ring-2 focus:ring-green-500" value={manualOrder.address} onChange={e => setManualOrder({...manualOrder, address: e.target.value})} placeholder="Customer Address..." />
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-colors disabled:opacity-50">
                                        {isSubmitting ? 'Saving...' : 'Save Order & Send SMS'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center gap-3">
                                    <div className="bg-gradient-to-br from-[#4ade80] to-[#25D366] w-10 h-10 rounded-xl shadow-lg flex items-center justify-center text-xl text-transparent relative border border-green-300 shrink-0" style={{ textShadow: '0 0 0 #064e3b' }}>💪</div>
                                    <span className="font-bold text-xl text-gray-900 hidden sm:inline">TUB Fit Admin</span>
                                </div>
                                <button onClick={() => {setIsAuthenticated(false); setPassword('');}} className="text-gray-500 hover:text-gray-900 text-sm font-medium"><i className="fas fa-sign-out-alt"></i> Logout</button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <h1 className="text-2xl font-bold text-gray-900">Orders Dashboard</h1>
                            
                            <div className="flex flex-wrap gap-3 items-center">
                                <button onClick={() => setIsManualModalOpen(true)} className="bg-[#25D366] hover:bg-[#1ebd5a] text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors">
                                    <i className="fas fa-plus"></i> WhatsApp Order
                                </button>
                                <div className="flex gap-2 items-center bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                                    <span className="text-sm text-gray-500 font-medium ml-2">Date:</span>
                                    <select className="border-none text-sm py-1.5 px-2 focus:ring-0 focus:outline-none bg-white font-bold cursor-pointer" value={filterDate} onChange={(e) => setFilterDate(e.target.value)}>
                                        {dateOptions.map((opt, idx) => (
                                            <option key={idx} value={opt.value}>{opt.label}</option>
                                        ))}
                                    </select>
                                    <button onClick={fetchOrders} disabled={loading} className="bg-gray-100 hover:bg-gray-200 text-gray-700 w-9 h-9 flex items-center justify-center rounded-lg text-sm font-medium transition-colors">
                                        <i className={`fas fa-sync-alt ${loading ? 'animate-spin' : ''}`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Stats Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex items-center gap-5">
                                <div className="bg-green-100 w-14 h-14 flex items-center justify-center rounded-2xl text-green-600 text-xl border border-green-200"><i className="fas fa-rupee-sign"></i></div>
                                <div><p className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">Total Sales</p><p className="text-3xl font-black text-gray-900">₹{totalSales}</p></div>
                            </div>
                            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex items-center gap-5">
                                <div className="bg-blue-100 w-14 h-14 flex items-center justify-center rounded-2xl text-blue-600 text-xl border border-blue-200"><i className="fas fa-shopping-bag"></i></div>
                                <div><p className="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">Total Orders</p><p className="text-3xl font-black text-gray-900">{orders.length}</p></div>
                            </div>
                        </div>

                        {error && <div className="bg-red-50 text-red-600 p-4 rounded-xl mb-6 text-sm font-medium"><i className="fas fa-exclamation-circle mr-2"></i> {error}</div>}

                        {/* Orders Table */}
                        <div className="bg-white shadow-sm rounded-3xl border border-gray-100 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Date & Time</th>
                                            <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Customer</th>
                                            <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Items</th>
                                            <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Delivery Details</th>
                                            <th scope="col" className="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-100">
                                        {loading && orders.length === 0 ? <tr><td colSpan="5" className="px-6 py-12 text-center text-gray-500"><i className="fas fa-circle-notch fa-spin text-3xl mb-3 text-green-500"></i><p className="font-medium">Loading your orders...</p></td></tr> : orders.length === 0 ? <tr><td colSpan="5" className="px-6 py-12 text-center text-gray-400"><div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3"><i className="fas fa-inbox text-2xl"></i></div><p className="font-medium">No orders found for this date.</p></td></tr> : orders.map((order, idx) => (
                                            <tr key={idx} className="hover:bg-gray-50/50 transition-colors">
                                                <td className="px-6 py-5 whitespace-nowrap">{order['Order ID'] && <div className="text-[11px] font-mono font-bold text-indigo-600 mb-1.5">{order['Order ID']}</div>}<div className="text-sm font-bold text-gray-900">{order['Delivery Date']}</div><div className="text-xs font-bold text-green-700 bg-green-100 inline-flex px-2.5 py-1 rounded-lg mt-1.5"><i className="far fa-clock mr-1"></i> {order['Time Slot']}</div><div className="text-[10px] text-gray-400 mt-2 font-medium">Placed: {order['Order Date']} at {order['Order Time']}</div></td>
                                                <td className="px-6 py-5"><div className="text-sm font-bold text-gray-900">{order['Customer Name']}</div><div className="text-xs text-gray-500 mt-1 font-medium bg-gray-100 inline-block px-2 py-1 rounded-md">{order['Phone']}</div></td>
                                                <td className="px-6 py-5"><div className="text-sm text-gray-700 whitespace-pre-wrap max-w-sm leading-relaxed">{order['Items']}</div>{order['Gym Promo Code'] && <div className="mt-2 inline-flex items-center px-2 py-1 rounded-md text-[11px] font-bold bg-orange-100 text-orange-800 uppercase tracking-wider border border-orange-200"><i className="fas fa-tag mr-1.5"></i> {order['Gym Promo Code']}</div>}</td>
                                                <td className="px-6 py-5"><div className="text-sm text-gray-900 capitalize font-bold mb-1.5 inline-flex items-center gap-1.5"><i className={`fas ${order['Delivery Type'] === 'gym' ? 'fa-dumbbell text-blue-500' : 'fa-home text-orange-500'}`}></i> {order['Delivery Type']}</div><div className="text-xs text-gray-500 max-w-[200px] truncate leading-relaxed" title={order['Address']}>{order['Address']}</div></td>
                                                <td className="px-6 py-5 whitespace-nowrap text-right"><div className="text-lg font-black text-gray-900">₹{order['Total Price']}</div></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
