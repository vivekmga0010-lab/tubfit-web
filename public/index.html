<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUB Delhi - The Ultimate Bowl</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 2.5em;
    }

    p {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 30px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
    }

    .response {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9ff;
      border-left: 4px solid #667eea;
      text-align: left;
      display: none;
    }

    .response.active {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .response pre {
      background: #fff;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 0.9em;
      color: #666;
      margin: 10px 0;
      border: 1px solid #ddd;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-weight: 600;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍲 TUB Delhi</h1>
    <p>The Ultimate Bowl - Web Application</p>
    <p style="font-size: 0.9em; color: #999;">Running on Node.js with Express</p>
    
    <div class="button-group">
      <button class="btn-primary" onclick="fetchMessage()">Fetch Message</button>
      <button class="btn-secondary" onclick="clearResponse()">Clear</button>
    </div>

    <div class="response" id="response">
      <h3>Response:</h3>
      <pre id="response-content">Waiting...</pre>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    console.log('Page loaded successfully');

    function fetchMessage() {
      console.log('Fetching message...');
      const responseDiv = document.getElementById('response');
      const statusDiv = document.getElementById('status');
      const contentDiv = document.getElementById('response-content');

      statusDiv.textContent = 'Loading...';
      statusDiv.className = 'status';
      responseDiv.classList.add('active');

      fetch('/api/hello')
        .then(response => {
          console.log('Response received:', response.status);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(data => {
          console.log('Data:', data);
          contentDiv.textContent = JSON.stringify(data, null, 2);
          statusDiv.textContent = '✅ Success!';
          statusDiv.className = 'status success';
        })
        .catch(error => {
          console.error('Fetch error:', error);
          contentDiv.textContent = 'Error: ' + error.message;
          statusDiv.textContent = '❌ Error: ' + error.message;
          statusDiv.className = 'status error';
        });
    }

    function clearResponse() {
      document.getElementById('response').classList.remove('active');
    }

    console.log('✅ TUB Delhi Web App initialized - Ready to debug!');
  </script>
</body>
</html>
